<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Hub - Game Launcher</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:#0a0a0a;
  color:white;
  overflow:hidden;
  min-height:100vh;
}

/* Starfield Background */
.starfield {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 1;
  pointer-events: none;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.5;
  animation: twinkle 3s infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

/* Constellation lines */
svg {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

line {
  stroke: rgba(0, 255, 225, 0.1);
  stroke-width: 1;
}

/* Main Container */
.container {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}

/* Logo */
.logo {
  font-size: 48px;
  font-weight: 300;
  letter-spacing: 2px;
  margin-bottom: 40px;
  color: #fff;
  text-shadow: 0 0 20px rgba(0, 255, 225, 0.5);
}

/* Search Bar */
.search-container {
  width: 100%;
  max-width: 600px;
  margin-bottom: 20px;
}

.search-bar {
  width: 100%;
  padding: 16px 20px;
  background: rgba(30, 30, 30, 0.8);
  border: 2px solid #00ffe1;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  transition: 0.3s;
  backdrop-filter: blur(10px);
}

.search-bar:focus {
  outline: none;
  box-shadow: 0 0 20px rgba(0, 255, 225, 0.5);
  background: rgba(30, 30, 30, 1);
}

.search-hint {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 10px;
}

/* Categories Section */
.categories {
  margin-top: 60px;
  width: 100%;
  max-width: 1000px;
}

.category-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #ccc;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 20px;
  justify-content: start;
}

.category-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background: rgba(30, 30, 30, 0.6);
  border: 2px solid rgba(0, 255, 225, 0.3);
  border-radius: 16px;
  cursor: pointer;
  transition: 0.3s ease;
  backdrop-filter: blur(10px);
}

.category-card:hover {
  transform: translateY(-8px) scale(1.05);
  border-color: #00ffe1;
  background: rgba(30, 30, 30, 0.9);
  box-shadow: 0 0 20px rgba(0, 255, 225, 0.4);
}

.category-icon {
  font-size: 36px;
  margin-bottom: 12px;
}

.category-card span {
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}

/* Games Section */
.games-section {
  margin-top: 60px;
  width: 100%;
  max-width: 1000px;
  margin-bottom: 100px;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.edit-link {
  font-size: 14px;
  color: #00ffe1;
  cursor: pointer;
  text-decoration: none;
  transition: 0.3s;
}

.edit-link:hover {
  color: #00ffff;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 15px;
}

.game-card {
  position: relative;
  background: rgba(30, 30, 30, 0.6);
  border: 2px solid rgba(0, 255, 225, 0.2);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s ease;
  backdrop-filter: blur(10px);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.game-card-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: 0.3s ease;
}

.game-card:hover {
  transform: translateY(-8px) scale(1.05);
  border-color: #00ffe1;
  box-shadow: 0 0 15px rgba(0, 255, 225, 0.3);
}

.game-card:hover .game-card-overlay {
  opacity: 1;
}

.play-icon {
  font-size: 32px;
  color: #00ffe1;
}

/* Responsive */
@media (max-width: 768px) {
  .logo {
    font-size: 36px;
    margin-bottom: 30px;
  }

  .search-bar {
    padding: 12px 16px;
    font-size: 14px;
  }

  .category-grid {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 15px;
  }

  .category-card {
    padding: 20px;
  }

  .category-icon {
    font-size: 28px;
  }

  .games-grid {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
}

</style>
</head>
<body>

<!-- Starfield Background -->
<div class="starfield" id="starfield"></div>

<!-- Main Container -->
<div class="container">
  <!-- Logo -->
  <div class="logo">fern</div>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" class="search-bar" id="searchInput" placeholder="search...">
    <div class="search-hint">Press Ctrl+Y to open command palette</div>
  </div>

  <!-- Quick Categories -->
  <div class="categories">
    <div class="category-title">Quick apps</div>
    <div class="category-grid">
      <div class="category-card" onclick="filterGames('games')">
        <div class="category-icon">🎮</div>
        <span>Games</span>
      </div>
      <div class="category-card" onclick="filterGames('action')">
        <div class="category-icon">⚡</div>
        <span>Action</span>
      </div>
      <div class="category-card" onclick="filterGames('puzzle')">
        <div class="category-icon">🧩</div>
        <span>Puzzle</span>
      </div>
      <div class="category-card" onclick="filterGames('racing')">
        <div class="category-icon">🏎️</div>
        <span>Racing</span>
      </div>
      <div class="category-card" onclick="filterGames('adventure')">
        <div class="category-icon">🗺️</div>
        <span>Adventure</span>
      </div>
      <div class="category-card" onclick="filterGames('music')">
        <div class="category-icon">🎵</div>
        <span>Music</span>
      </div>
    </div>
  </div>

  <!-- Featured Games -->
  <div class="games-section">
    <div class="section-title">
      <span id="sectionTitle">🔥 Featured Games</span>
      <a class="edit-link" onclick="resetFilter()">Clear Filter</a>
    </div>
    <div class="games-grid" id="gamesGrid">
      <!-- Games will be populated here -->
    </div>
  </div>
</div>

<script>

// Generate Starfield
function generateStarfield() {
  const starfield = document.getElementById('starfield');
  const starCount = 100;
  
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 2 + 'px';
    star.style.height = star.style.width;
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starfield.appendChild(star);
  }

  // Add constellation lines
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  for (let i = 0; i < 15; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', Math.random() * window.innerWidth);
    line.setAttribute('y1', Math.random() * window.innerHeight);
    line.setAttribute('x2', Math.random() * window.innerWidth);
    line.setAttribute('y2', Math.random() * window.innerHeight);
    svg.appendChild(line);
  }
  starfield.appendChild(svg);
}

// Games Database
const gamesDatabase = [
  { name: 'Zombie Survival', category: 'action', image: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Racing Drift', category: 'racing', image: 'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Parkour Jump', category: 'action', image: 'https://images.unsplash.com/photo-1548686304-89d188a80029?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Space Battle', category: 'action', image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Puzzle Quest', category: 'puzzle', image: 'https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Sound Drop', category: 'music', image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Mountain Climb', category: 'adventure', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
  { name: 'Desert Explorer', category: 'adventure', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=200&auto=format&fit=crop', link: 'https://example.com' },
];

let currentFilter = 'games';

// Render Games
function renderGames(filter = 'games') {
  const gamesGrid = document.getElementById('gamesGrid');
  gamesGrid.innerHTML = '';

  let filtered = gamesDatabase;
  if (filter !== 'games') {
    filtered = gamesDatabase.filter(game => game.category === filter);
  }

  filtered.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <img src="${game.image}" alt="${game.name}">
      <div class="game-card-overlay" onclick="window.location.href='${game.link}'">
        <div class="play-icon">▶</div>
      </div>
    `;
    gamesGrid.appendChild(card);
  });
}

// Filter Games
function filterGames(category) {
  currentFilter = category;
  const categoryNames = {
    'games': '🔥 Featured Games',
    'action': '⚡ Action Games',
    'puzzle': '🧩 Puzzle Games',
    'racing': '🏎️ Racing Games',
    'adventure': '🗺️ Adventure Games',
    'music': '🎵 Music Games'
  };
  document.getElementById('sectionTitle').textContent = categoryNames[category];
  renderGames(category);
}

// Reset Filter
function resetFilter() {
  currentFilter = 'games';
  document.getElementById('sectionTitle').textContent = '🔥 Featured Games';
  document.getElementById('searchInput').value = '';
  renderGames('games');
}

// Search Functionality
document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const gamesGrid = document.getElementById('gamesGrid');
  gamesGrid.innerHTML = '';

  let filtered = gamesDatabase;
  if (query) {
    filtered = gamesDatabase.filter(game => game.name.toLowerCase().includes(query));
  }

  filtered.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <img src="${game.image}" alt="${game.name}">
      <div class="game-card-overlay" onclick="window.location.href='${game.link}'">
        <div class="play-icon">▶</div>
      </div>
    `;
    gamesGrid.appendChild(card);
  });

  if (query) {
    document.getElementById('sectionTitle').textContent = `Search: "${query}"`;
  }
});

// Keyboard Shortcut (Ctrl+Y)
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'y') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// Initialize
window.addEventListener('load', () => {
  generateStarfield();
  renderGames();
});

</script>

</body>
</html>
